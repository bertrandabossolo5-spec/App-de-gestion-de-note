<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion de Notes - Frontend</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1>Gestion de Notes</h1>
            <p>Interface connectée au backend Node.js</p>
        </header>

        <!-- Formulaire d'ajout de note -->
        <section class="card">
            <h2>Ajouter une nouvelle note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="student-name">Nom de l'étudiant :</label>
                    <input type="text" id="student-name" placeholder="Ex: Jean Dupont" required>
                </div>
                <div class="form-group">
                    <label for="student-note">Note / 20 :</label>
                    <input type="number" id="student-note" min="0" max="20" step="0.5" placeholder="Ex: 15" required>
                </div>
                <button type="submit" class="btn-primary">Enregistrer la note</button>
            </form>
        </section>

        <!-- Liste des notes -->
        <section class="card">
            <h2>Liste des notes enregistrées</h2>
            <ul id="notes-list">
                <!-- Les notes s'afficheront ici dynamiquement -->
                <li class="empty-state">Aucune note pour le moment...</li>
            </ul>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
